context.properties = { application.name = "Musubi EQ helper" }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = 0 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Studio EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = left0 label = bq_peaking control = { "Freq" = 1000 "Q" = 1 "Gain" = 12 } }
          { type = builtin name = right0 label = bq_peaking control = { "Freq" = 1000 "Q" = 1 "Gain" = 12 } }
          { type = builtin name = left1 label = bq_highshelf control = { "Freq" = 6000 "Q" = 0.7 "Gain" = -2 } }
          { type = builtin name = right1 label = bq_highshelf control = { "Freq" = 6000 "Q" = 0.7 "Gain" = -2 } }
        ]
        links = [
          { output = "left0:Out" input = "left1:In" }
          { output = "right0:Out" input = "right1:In" }
        ]
        inputs = [ "left0:In" "right0:In" ]
        outputs = [ "left1:Out" "right1:Out" ]
      }
      capture.props = { node.name = "musubi_eq.studio" media.class = Audio/Sink audio.channels = 2 audio.position = [ FL FR ] node.always-process = true }
      playback.props = { node.name = "musubi_eq.studio.playback" node.passive = true audio.channels = 2 audio.position = [ FL FR ] target.object = "alsa_output.test" }
    }
  }
]
