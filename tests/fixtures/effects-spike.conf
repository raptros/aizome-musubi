context.properties = { application.name = "Musubi effect helper spike" }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = 0 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Musubi spike EQ"
      filter.graph = {
        nodes = [
          { type = builtin name = left label = bq_peaking control = { "Freq" = 1000 "Q" = 1 "Gain" = 0 } }
          { type = builtin name = right label = bq_peaking control = { "Freq" = 1000 "Q" = 1 "Gain" = 0 } }
        ]
        inputs = [ "left:In" "right:In" ]
        outputs = [ "left:Out" "right:Out" ]
      }
      capture.props = { node.name = musubi_spike_capture media.class = Audio/Sink audio.channels = 2 audio.position = [ FL FR ] node.always-process = true }
      playback.props = { node.name = musubi_spike_playback target.object = musubi_test_speakers node.passive = true audio.channels = 2 audio.position = [ FL FR ] }
    }
  }
]
